# Deploy the Fine Arts Exhibition API on TrueNAS
#
# Usage: cd /mnt/Pool/fine-arts-api && docker compose up -d --build

version: "3.8"

services:
  fine-arts-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fine-arts-api
    restart: unless-stopped
    network_mode: host
    environment:
      - MEGA_EMAIL=${MEGA_EMAIL:-bacheloroffineartsanu@tutamail.com}
      - MEGA_PASSWORD=${MEGA_PASSWORD:-Fine-arts2026}
      - MEGA_ROOT_FOLDER=${MEGA_ROOT_FOLDER:-Fine Arts Exhibition}
      - UPLOAD_DIR=/data/uploads
      - PORT=8088
      - MAX_FILE_MB=50
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:8088}
    volumes:
      - ./uploads:/data/uploads
