<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fine Arts Exhibition ANU</title>
  <style>
    :root {
      --ink: #050505;
      --paper: #ffffff;
      --muted: #666666;
      --line: #d9d9d9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--paper);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      padding: 32px;
    }

    main {
      width: min(980px, 100%);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 18px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--muted);
    }

    h1 {
      margin: 0;
      font-size: clamp(54px, 10vw, 140px);
      line-height: 0.9;
      letter-spacing: -0.08em;
      text-transform: uppercase;
      font-weight: 950;
    }

    .prompt {
      margin: 32px auto 0;
      font-size: clamp(22px, 3vw, 34px);
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .choice-grid {
      margin: 44px auto 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(220px, 1fr));
      gap: 20px;
      max-width: 700px;
    }

    .choice-card {
      display: flex;
      min-height: 180px;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--ink);
      color: var(--ink);
      text-decoration: none;
      border-radius: 28px;
      font-size: clamp(28px, 4vw, 54px);
      font-weight: 950;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      transition: transform 160ms ease, background 160ms ease, color 160ms ease;
    }

    .choice-card:hover,
    .choice-card:focus-visible {
      background: var(--ink);
      color: var(--paper);
      transform: translateY(-4px);
      outline: none;
    }

    .note {
      margin: 34px auto 0;
      max-width: 640px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    @media (max-width: 680px) {
      body { padding: 24px; }
      .choice-grid { grid-template-columns: 1fr; }
      .choice-card { min-height: 132px; }
    }
  </style>
</head>
<body>
  <main aria-labelledby="page-title">
    <p class="eyebrow">ANU Fine Arts Exhibition</p>
    <h1 id="page-title">Fine Arts<br />Exhibition</h1>
    <p class="prompt">Choose your access</p>

    <nav class="choice-grid" aria-label="Choose access type">
      <a id="student-link" class="choice-card" href="student.html">Student</a>
      <a id="admin-link" class="choice-card" href="admin.html">Admin</a>
    </nav>

    <p class="note">Students can register artwork. Admin access is for exhibition review and management.</p>
  </main>
</body>
</html>
