<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Fine Arts Exhibition ANU</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: #050505;
      font-family: Arial, Helvetica, sans-serif;
      padding: 32px;
    }
    main {
      width: min(760px, 100%);
      border: 2px solid #050505;
      border-radius: 28px;
      padding: clamp(28px, 5vw, 56px);
      text-align: center;
    }
    main[hidden], .admin-panel[hidden], .login-panel[hidden] {
      display: none !important;
    }
    h1 {
      margin: 0;
      font-size: clamp(48px, 9vw, 104px);
      line-height: 0.9;
      letter-spacing: -0.08em;
      text-transform: uppercase;
    }
    p {
      margin: 24px auto 0;
      max-width: 560px;
      color: #555555;
      font-size: 17px;
      line-height: 1.6;
    }
    .actions {
      margin-top: 34px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
    }
    a, button {
      border: 2px solid #050505;
      border-radius: 999px;
      background: #050505;
      color: #ffffff;
      padding: 13px 20px;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 900;
      font-size: 13px;
      cursor: pointer;
    }
    a.secondary {
      background: #ffffff;
      color: #050505;
    }
    .stat {
      margin-top: 30px;
      font-size: 44px;
      font-weight: 950;
      color: #050505;
    }
    .admin-password-form {
      margin-top: 32px;
      display: grid;
      gap: 14px;
      text-align: left;
    }
    label {
      font-size: 13px;
      font-weight: 950;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    input[type="password"] {
      width: 100%;
      border: 1px solid #bfc8ca;
      border-radius: 12px;
      padding: 14px 16px;
      color: #050505;
      font: inherit;
      font-size: 16px;
    }
    .auth-message {
      min-height: 22px;
      margin: 0;
      color: #9b1c1c;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }
    .admin-top-row {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 18px;
    }
    button.secondary-button {
      background: #ffffff;
      color: #050505;
    }
  </style>
</head>
<body>
  <main class="login-panel" id="admin-login-panel" aria-labelledby="admin-login-title">
    <h1 id="admin-login-title">Admin</h1>
    <p>Enter the admin password to view Fine Arts Exhibition management information.</p>
    <form class="admin-password-form" id="admin-password-form" action="#">
      <div>
        <label for="admin-password">Password</label>
        <input id="admin-password" name="adminPassword" type="password" autocomplete="current-password" required />
      </div>
      <button type="submit">Open Admin</button>
      <p class="auth-message" id="admin-auth-message" aria-live="polite"></p>
    </form>
    <div class="actions">
      <a class="secondary" href="index.html">Back</a>
    </div>
  </main>

  <main class="admin-panel" id="admin-panel" aria-labelledby="admin-title" hidden>
    <div class="admin-top-row">
      <button class="secondary-button" type="button" id="admin-logout-button">Lock Admin</button>
    </div>
    <h1 id="admin-title">Admin</h1>
    <p>Admin review tools are not public yet. This page shows the live registration count and keeps management access separate from student registration.</p>
    <div id="admin-artwork-count" class="stat">0</div>
    <p>Total artworks registered</p>
    <div class="actions">
      <a href="student.html">Open Student Page</a>
      <a class="secondary" href="index.html">Back</a>
    </div>
  </main>
  <script>
    const API_URL = 'http://192.168.1.45:8088';
    const ADMIN_PASSWORD_HASH = '9254c1e1f3e2f78d789d4abd092f6a99aef737a76561b0da5493fc2e248844f0';
    const ADMIN_AUTH_KEY = 'fineArtsAdminAuthenticated';
    const adminLoginPanel = document.getElementById('admin-login-panel');
    const adminPanel = document.getElementById('admin-panel');
    const adminPasswordForm = document.getElementById('admin-password-form');
    const adminPasswordInput = document.getElementById('admin-password');
    const adminAuthMessage = document.getElementById('admin-auth-message');
    const adminLogoutButton = document.getElementById('admin-logout-button');

    async function sha256Hex(value) {
      const encoded = new TextEncoder().encode(value);
      const digest = await crypto.subtle.digest('SHA-256', encoded);
      return Array.from(new Uint8Array(digest)).map((byte) => byte.toString(16).padStart(2, '0')).join('');
    }

    function showAdminPanel() {
      adminLoginPanel.hidden = true;
      adminPanel.hidden = false;
      updateAdminArtworkCount();
    }

    function showLoginPanel(message = '') {
      adminPanel.hidden = true;
      adminLoginPanel.hidden = false;
      adminAuthMessage.textContent = message;
      adminPasswordInput.value = '';
      adminPasswordInput.focus();
    }

    function shouldUseLanApi() {
      const host = window.location.hostname;
      return window.location.protocol === 'file:'
        || host === 'localhost'
        || host === '127.0.0.1'
        || host.startsWith('192.168.')
        || host.endsWith('.local');
    }

    async function fetchStatsJson() {
      const response = await fetch(`./stats.json?v=${Date.now()}`, { cache: 'no-store' });
      if (!response.ok) throw new Error(`stats.json request failed: ${response.status}`);
      return response.json();
    }

    async function fetchLanStats() {
      const response = await fetch(`${API_URL}/api/stats`, { cache: 'no-store' });
      if (!response.ok) throw new Error(`Stats request failed: ${response.status}`);
      return response.json();
    }

    async function updateAdminArtworkCount() {
      const count = document.getElementById('admin-artwork-count');
      if (!count) return;
      try {
        const stats = shouldUseLanApi() ? await fetchLanStats() : await fetchStatsJson();
        count.textContent = String(Number(stats.totalArtworksRegistered || 0));
      } catch (error) {
        console.warn('Could not update admin artwork count', error);
      }
    }
    adminPasswordForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      adminAuthMessage.textContent = '';
      const passwordHash = await sha256Hex(adminPasswordInput.value);
      if (passwordHash !== ADMIN_PASSWORD_HASH) {
        sessionStorage.removeItem(ADMIN_AUTH_KEY);
        showLoginPanel('Incorrect password.');
        return;
      }
      sessionStorage.setItem(ADMIN_AUTH_KEY, 'true');
      showAdminPanel();
    });

    adminLogoutButton.addEventListener('click', () => {
      sessionStorage.removeItem(ADMIN_AUTH_KEY);
      showLoginPanel();
    });

    if (sessionStorage.getItem(ADMIN_AUTH_KEY) === 'true') {
      showAdminPanel();
    } else {
      showLoginPanel();
    }
  </script>
</body>
</html>
